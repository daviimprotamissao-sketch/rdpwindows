# ══════════ Feito por Daviz ══════════
# Windows remoto no GitHub Actions · RDP pela Tailscale · com som · em português (Brasil)
#
# SEGREDOS (Settings → Secrets and variables → Actions):
#   TAILSCALE_AUTHKEY  chave da Tailscale (use uma chave "efêmera" e "reutilizável")
#   RDP_PASSWORD       senha do usuário do RDP: 12+ caracteres, misturando 3 de 4 tipos
#                      (minúscula, maiúscula, número e símbolo)
#
# COMO USAR: Actions → "Windows Remoto" → Run workflow. Quando o resumo da execução mostrar
# "Windows remoto pronto", ligue a Tailscale no aparelho e conecte pela Área de Trabalho Remota.
# Só a sua tailnet enxerga a porta 3389. Em repositório público, o log e o resumo também são públicos.

name: 🖥️ Windows Remoto

run-name: "🖥️ Windows remoto · ${{ inputs.runner }} · ${{ inputs.horas }} h"

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Imagem do Windows (2022 ≈ Win10 · 2025 ≈ Win11). A interface em português só instala no 2025"
        type: choice
        options:
          - windows-2025
          - windows-2022
        default: windows-2025
      horas:
        description: "Duração da sessão em horas (ponto ou vírgula; máx. 5.5)"
        type: string
        default: "5"
      usuario:
        description: "Nome do usuário do RDP (vira administrador)"
        type: string
        default: "usuario"
      nome_maquina:
        description: "Nome da máquina na Tailscale (fixo = o endereço é sempre o mesmo)"
        type: string
        default: "gh-rdp"
      ocioso_min:
        description: "Encerrar se ninguém ficar conectado por X minutos (0 = nunca)"
        type: string
        default: "60"
      idioma_ptbr:
        description: "Windows em português (Brasil): fuso, teclado ABNT2, formatos e idioma da interface"
        type: boolean
        default: true
      liberar_downloads:
        description: "Liberar downloads (desliga SmartScreen e Defender; a VM é descartável)"
        type: boolean
        default: true
      programas:
        description: "Programas extras pelo Chocolatey, separados por espaço (ex.: vscode notepadplusplus)"
        type: string
        default: ""
      liberar_espaco:
        description: "Apagar ferramentas pré-instaladas do runner (Android, hostedtoolcache...) para ganhar disco"
        type: boolean
        default: false

concurrency:
  group: windows-remoto
  cancel-in-progress: true

permissions:
  contents: read

env:
  POWERSHELL_TELEMETRY_OPTOUT: "1"
  POWERSHELL_UPDATECHECK: "Off"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  rdp:
    name: "🖥️ Sessão remota"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh

    steps:
      # ───────────────── 1 · conferir segredos e opções ─────────────────
      - name: "🔐 Conferir segredos e opções"
        env:
          K: ${{ secrets.TAILSCALE_AUTHKEY }}
          P: ${{ secrets.RDP_PASSWORD }}
          USUARIO: ${{ inputs.usuario }}
          MAQUINA: ${{ inputs.nome_maquina }}
          HORAS: ${{ inputs.horas }}
          OCIOSO: ${{ inputs.ocioso_min }}
        run: |
          $erros = @()
          $inv = [Globalization.CultureInfo]::InvariantCulture

          # segredos
          if (-not $env:K) { $erros += 'Falta o segredo TAILSCALE_AUTHKEY.' }
          if (-not $env:P) {
            $erros += 'Falta o segredo RDP_PASSWORD.'
          } else {
            if ($env:P.Length -lt 12) { $erros += 'RDP_PASSWORD precisa ter 12 caracteres ou mais.' }
            $classes = 0
            foreach ($re in '[a-z]', '[A-Z]', '[0-9]', '[^a-zA-Z0-9]') { if ($env:P -cmatch $re) { $classes++ } }
            if ($classes -lt 3) { $erros += 'RDP_PASSWORD precisa misturar 3 destes 4: minúscula, maiúscula, número e símbolo (o Windows exige).' }
            if ($env:USUARIO.Length -ge 3 -and $env:P.IndexOf($env:USUARIO, [StringComparison]::OrdinalIgnoreCase) -ge 0) { $erros += 'RDP_PASSWORD não pode conter o nome do usuário.' }
          }

          # nomes
          $reservados = 'administrator', 'administrador', 'guest', 'convidado', 'runneradmin', 'defaultaccount', 'wdagutilityaccount', 'system'
          if ($env:USUARIO -notmatch '^[A-Za-z][A-Za-z0-9_-]{0,19}$') {
            $erros += 'Usuário inválido: use até 20 letras, números, _ ou -, começando por letra.'
          } elseif ($reservados -contains $env:USUARIO.ToLower()) {
            $erros += "O nome '$($env:USUARIO)' é reservado pelo Windows. Escolha outro."
          }
          if ($env:MAQUINA -notmatch '^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$') {
            $erros += 'Nome da máquina inválido: só letras, números e hífen (sem hífen no começo ou no fim, até 63 caracteres).'
          }

          # tempos
          $h = 0.0
          $txt = "$($env:HORAS)".Trim().Replace(',', '.')
          if (-not [double]::TryParse($txt, [Globalization.NumberStyles]::Float, $inv, [ref]$h)) {
            $erros += "Duração inválida: '$($env:HORAS)'. Exemplos: 5 ou 2.5"
          }
          $oc = 0
          if (-not [int]::TryParse("$($env:OCIOSO)".Trim(), [ref]$oc) -or $oc -lt 0) {
            $erros += "Tempo ocioso inválido: '$($env:OCIOSO)'. Use minutos inteiros (0 = nunca)."
          }

          if ($erros.Count -gt 0) {
            foreach ($e in $erros) { Write-Host "::error::$e" }
            throw 'Corrija os itens acima e rode de novo.'
          }

          # o relógio da sessão conta a partir de agora (o job tem limite de 6 h)
          if (($h * 60) -gt 330) { Write-Host '⚠️ O máximo é 5.5 h: a duração foi reduzida.' }
          $min = [int][Math]::Min([Math]::Max($h * 60, 5), 330)
          $fim = [DateTimeOffset]::UtcNow.AddMinutes($min).ToUnixTimeSeconds()
          Add-Content -Path $env:GITHUB_ENV -Value "SESSAO_MIN=$min", "SESSAO_FIM=$fim", "OCIOSO_MIN=$oc" -Encoding utf8

          $txtOc = 'desligado'
          if ($oc -gt 0) { $txtOc = "$oc min" }
          Write-Host "✅ Tudo certo · sessão de $min min · encerrar por ociosidade: $txtOc"

      # ───────────────── 2 · usuário, RDP e firewall ─────────────────
      - name: "👤 Usuário, RDP e firewall"
        env:
          RDP_USER: ${{ inputs.usuario }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Set-Reg($Path, $Name, $Value, $Type = 'DWord') {
            if (-not (Test-Path $Path)) { New-Item -Path $Path -Force | Out-Null }
            New-ItemProperty -Path $Path -Name $Name -Value $Value -PropertyType $Type -Force | Out-Null
          }

          Write-Host '::group::👤 Usuário'
          $u = $env:RDP_USER
          $senha = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (Get-LocalUser -Name $u -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $u -Password $senha
            Enable-LocalUser -Name $u
          } else {
            New-LocalUser -Name $u -Password $senha -FullName $u -Description 'Usuário do RDP (GitHub Actions)' `
              -PasswordNeverExpires -AccountNeverExpires | Out-Null
          }
          # grupos pelo SID: funcionam em qualquer idioma do Windows
          foreach ($sid in 'S-1-5-32-544', 'S-1-5-32-555') {
            Add-LocalGroupMember -SID $sid -Member $u -ErrorAction SilentlyContinue
          }
          $admins = @(Get-LocalGroupMember -SID 'S-1-5-32-544' | ForEach-Object { $_.Name })
          $remoto = @(Get-LocalGroupMember -SID 'S-1-5-32-555' | ForEach-Object { $_.Name })
          if (-not ($admins | Where-Object { $_ -like "*\$u" })) { throw "Não consegui pôr '$u' no grupo de administradores." }
          if (-not ($remoto | Where-Object { $_ -like "*\$u" })) { throw "Não consegui pôr '$u' no grupo da Área de Trabalho Remota." }
          Write-Host "✅ Usuário '$u' pronto (administrador + RDP)"
          Write-Host '::endgroup::'

          Write-Host '::group::🖥️ Área de Trabalho Remota'
          Set-Reg 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' 'fDenyTSConnections' 0
          Set-Service TermService -StartupType Automatic
          if ((Get-Service TermService).Status -ne 'Running') { Start-Service TermService }
          Write-Host '✅ RDP ligado'
          Write-Host '::endgroup::'

          Write-Host '::group::🔥 Firewall (RDP só pela Tailscale)'
          $tailnet = '100.64.0.0/10', 'fd7a:115c:a1e0::/48'
          foreach ($p in 'TCP', 'UDP') {
            New-NetFirewallRule -DisplayName "RDP pela Tailscale ($p)" -Direction Inbound -Protocol $p `
              -LocalPort 3389 -RemoteAddress $tailnet -Action Allow -Profile Any | Out-Null
          }
          # regras padrão do RDP (grupo pelo nome interno, que não muda com o idioma): só a tailnet
          $padrao = Get-NetFirewallRule -Group '@FirewallAPI.dll,-28752' -ErrorAction SilentlyContinue
          if ($padrao) { $padrao | Set-NetFirewallRule -RemoteAddress $tailnet -Profile Any -Enabled True -ErrorAction SilentlyContinue }
          Write-Host '✅ Porta 3389 liberada só para a sua tailnet'
          Write-Host '::endgroup::'

      # ───────────────── 3 · som, rede e desempenho ─────────────────
      - name: "🔊 Som, rede e desempenho"
        run: |
          $ErrorActionPreference = 'Continue'
          function Set-Reg($Path, $Name, $Value, $Type = 'DWord') {
            if (-not (Test-Path $Path)) { New-Item -Path $Path -Force | Out-Null }
            New-ItemProperty -Path $Path -Name $Name -Value $Value -PropertyType $Type -Force | Out-Null
          }
          $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          $ts  = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'

          Write-Host '::group::🔊 Som (áudio do RDP)'
          # O runner não tem placa de som: o RDP cria o dispositivo virtual "Remote Audio" para o seu aparelho.
          # Para isso o serviço de áudio do Windows precisa estar rodando ANTES de você conectar.
          foreach ($s in 'AudioEndpointBuilder', 'Audiosrv') {
            Set-Service -Name $s -StartupType Automatic -ErrorAction SilentlyContinue
            Start-Service -Name $s -ErrorAction SilentlyContinue
          }
          Set-Reg $pol 'fDisableAudio' 0           # reprodução de áudio permitida
          Set-Reg $pol 'fDisableAudioCapture' 0    # microfone permitido (chamadas e chat de voz)
          Get-Service AudioEndpointBuilder, Audiosrv | Format-Table Name, Status, StartType -AutoSize | Out-String | Write-Host
          Write-Host '::endgroup::'

          Write-Host '::group::🌐 Rede e imagem do RDP'
          Set-Reg $pol 'SelectTransport' 0            # TCP + UDP: mais fluido e menos engasgo
          Set-Reg $pol 'KeepAliveEnable' 1            # percebe a queda do aparelho em cerca de 1 min
          Set-Reg $pol 'KeepAliveInterval' 1
          Set-Reg $pol 'fDisableAutoReconnect' 0      # reconecta sozinho se a rede oscilar
          Set-Reg $pol 'MaxIdleTime' 0                # nunca encerra a sessão por inatividade
          Set-Reg $pol 'MaxDisconnectionTime' 0       # nem desconectada: seus programas continuam abertos
          Set-Reg $pol 'MaxConnectionTime' 0
          Set-Reg $pol 'fDisableClip' 0               # copiar e colar
          Set-Reg $pol 'fDisableCdm' 0                # pastas do aparelho dentro do RDP
          Set-Reg "$ts\WinStations" 'DWMFRAMEINTERVAL' 15   # 60 quadros por segundo (o padrão é 30)
          Set-Reg $pol 'bEnumerateHWBeforeSW' 1
          Set-Reg $pol 'AVCHardwareEncodePreferred' 1
          Set-Reg $pol 'AVC444ModePreferred' 1        # H.264 4:4:4: texto mais nítido
          Set-Reg 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' 'VerboseStatus' 1
          Write-Host '✅ Ajustes aplicados'
          Write-Host '::endgroup::'

          Write-Host '::group::⚡ Desempenho'
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMIN 100
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR CPMINCORES 100
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /hibernate off
          powercfg /setactive SCHEME_CURRENT
          # serviços que só gastam CPU e disco numa VM descartável
          foreach ($s in 'WSearch', 'SysMain', 'DiagTrack') {
            if (Get-Service $s -ErrorAction SilentlyContinue) {
              Stop-Service $s -Force -ErrorAction SilentlyContinue
              Set-Service $s -StartupType Disabled -ErrorAction SilentlyContinue
            }
          }
          # o Gerenciador do Servidor não abre sozinho a cada login
          Set-Reg 'HKLM:\SOFTWARE\Microsoft\ServerManager' 'DoNotOpenServerManagerAtLogon' 1
          Write-Host '✅ CPU em alto desempenho e serviços inúteis desligados'
          Write-Host '::endgroup::'

          # atalho na Área de Trabalho para encerrar a sessão (sem acento: .bat não lida bem com isso)
          $bat = @(
            '@echo off',
            'echo parar> "C:\Users\Public\PARAR.txt"',
            'echo Encerrando a sessao em instantes...',
            'timeout /t 3 >nul'
          ) -join "`r`n"
          Set-Content -Path 'C:\Users\Public\Desktop\Encerrar-sessao.bat' -Value $bat -Encoding Ascii
          exit 0

      # ───────────────── 4 · região, teclado e fuso (Brasil) ─────────────────
      - name: "🌎 Região, teclado e fuso horário (Brasil)"
        if: inputs.idioma_ptbr
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          try { [Console]::OutputEncoding = [System.Text.Encoding]::UTF8 } catch { }

          try {
            Set-TimeZone -Id 'E. South America Standard Time'
            Write-Host '🕒 Fuso horário: Brasília (UTC-3)'
          } catch { Write-Host ('::warning::Fuso horário: ' + $_.Exception.Message) }

          # Roda ANTES de você conectar: o usuário do RDP já nasce com tudo em português
          try {
            Set-WinHomeLocation -GeoId 32
            Set-Culture -CultureInfo pt-BR
            $lista = New-WinUserLanguageList -Language 'pt-BR'
            $lista[0].InputMethodTips.Clear()
            $lista[0].InputMethodTips.Add('0416:00010416')
            Set-WinUserLanguageList -LanguageList $lista -Force
            Set-WinDefaultInputMethodOverride -InputTip '0416:00010416'
            Set-WinSystemLocale -SystemLocale pt-BR
            Copy-UserInternationalSettingsToSystem -WelcomeScreen $true -NewUser $true
            Write-Host '✅ Região Brasil, teclado ABNT2 e formatos pt-BR aplicados (valem para o usuário do RDP)'
          } catch { Write-Host ('::warning::Região e teclado: ' + $_.Exception.Message) }
          exit 0

      # ───────────────── 5 · Tailscale ─────────────────
      - name: "🔗 Tailscale"
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: ${{ inputs.nome_maquina }}
          # o runner não precisa do DNS nem das rotas da sua tailnet (evita quebrar a internet dele)
          args: "--accept-dns=false --accept-routes=false"

      - name: "✅ Pronto para conectar"
        env:
          RDP_USER: ${{ inputs.usuario }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'

          $ts = (Get-Command tailscale -ErrorAction SilentlyContinue).Source
          if (-not $ts) { $ts = 'C:\Program Files\Tailscale\tailscale.exe' }
          $st = (& $ts status --json) | ConvertFrom-Json
          if ($st.BackendState -ne 'Running') {
            throw "A Tailscale não conectou (estado: $($st.BackendState)). Confira a chave TAILSCALE_AUTHKEY."
          }
          $ip4  = (& $ts ip -4 | Select-Object -First 1)
          $nome = "$($st.Self.DNSName)".TrimEnd('.')
          if (-not $nome) { $nome = $ip4 }

          $rdp = [bool](Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue)
          $som = (Get-Service Audiosrv -ErrorAction SilentlyContinue).Status -eq 'Running'
          $net = 'sem resposta'
          try {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            Invoke-WebRequest -Uri 'https://api.github.com' -Method Head -UseBasicParsing -TimeoutSec 10 | Out-Null
            $net = "ok ($($sw.ElapsedMilliseconds) ms)"
          } catch { $net = 'falhou: ' + $_.Exception.Message }

          $cs    = Get-CimInstance Win32_ComputerSystem
          $cpu   = $cs.NumberOfLogicalProcessors
          $ram   = [math]::Round($cs.TotalPhysicalMemory / 1GB)
          $livre = [math]::Round((Get-PSDrive C).Free / 1GB)
          $fimBr = [DateTimeOffset]::FromUnixTimeSeconds([long]$env:SESSAO_FIM).ToOffset([TimeSpan]::FromHours(-3)).ToString('HH:mm')

          function Sim($v) { if ($v) { 'sim' } else { 'NÃO' } }
          Write-Host '::group::📋 Estado da máquina'
          Write-Host "🔗 Tailscale ......... $($st.BackendState) · $nome · $ip4"
          Write-Host "🖥️ RDP (porta 3389) .. ouvindo: $(Sim $rdp)"
          Write-Host "🔊 Serviço de áudio .. rodando: $(Sim $som)"
          Write-Host "🌐 Internet .......... $net"
          Write-Host "💻 Máquina ........... $cpu vCPU · $ram GB de RAM · $livre GB livres no C:"
          Write-Host '::endgroup::'
          if (-not $rdp) { Write-Host '::warning::A porta 3389 não está ouvindo: o RDP pode não conectar.' }
          if (-not $som) { Write-Host '::warning::O serviço de áudio não está rodando: o som pode não sair.' }

          $md = @(
            '## 🖥️ Windows remoto pronto',
            '',
            'Ligue a **Tailscale** no aparelho, abra a **Área de Trabalho Remota** (ou o Windows App) e conecte em:',
            '',
            '| | |',
            '|---|---|',
            ('| **Endereço** | `' + $nome + '` |'),
            ('| **IP da Tailscale** | `' + $ip4 + '` |'),
            ('| **Usuário** | `' + $env:RDP_USER + '` |'),
            '| **Senha** | a do segredo `RDP_PASSWORD` |',
            ('| **Sessão até** | ' + $fimBr + ' (horário de Brasília) |'),
            ('| **Máquina** | ' + $cpu + ' vCPU · ' + $ram + ' GB de RAM · ' + $livre + ' GB livres no C: |'),
            '',
            '- 🔊 **Som:** deixe o áudio remoto em "Reproduzir neste dispositivo" (já vem assim no app do celular)',
            '- 🛑 **Encerrar antes:** ícone `Encerrar-sessao` na Área de Trabalho, ou crie `C:\Users\Public\PARAR.txt`, ou cancele o workflow',
            '- 🌎 **Português:** região, teclado e fuso já estão no Brasil. A interface traduzida aparece depois que o log mostrar "Idioma instalado": desconecte e conecte de novo',
            '- ⏳ As etapas seguintes (idioma, programas) rodam enquanto você já pode conectar'
          )
          $md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "✅ Pronto! Conecte em $nome (ou $ip4) com o usuário '$($env:RDP_USER)'."

      # ───────────────── 6 · extras (você já pode conectar) ─────────────────
      - name: "🈂️ Idioma da interface em português (Windows Server 2025)"
        if: inputs.idioma_ptbr
        continue-on-error: true
        timeout-minutes: 20
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          try { [Console]::OutputEncoding = [System.Text.Encoding]::UTF8 } catch { }

          if (-not (Get-Command Install-Language -ErrorAction SilentlyContinue)) {
            Write-Host '::warning::O Windows Server 2022 não tem o comando Install-Language, então a interface continua em inglês. Escolha windows-2025 para ela virar português. Região, teclado ABNT2 e fuso do Brasil já estão aplicados.'
            exit 0
          }

          Write-Host '::group::🈂️ Instalando o idioma português (Brasil): pode levar alguns minutos'
          foreach ($s in 'bits', 'wuauserv', 'UsoSvc') {
            try { Set-Service -Name $s -StartupType Manual -ErrorAction Stop; Start-Service -Name $s -ErrorAction SilentlyContinue } catch { }
          }
          $ok = $false
          try {
            Install-Language -Language pt-BR -ErrorAction Stop | Out-Host
            $ok = $true
          } catch { Write-Host ('::warning::Não consegui instalar o idioma: ' + $_.Exception.Message) }

          if ($ok) {
            # deixa o português como idioma de exibição de quem já tem perfil e dos perfis novos
            $reg = Join-Path $env:windir 'System32\reg.exe'
            $perfis = @(Get-ChildItem 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^S-1-5-21-[0-9-]+$' })
            foreach ($p in $perfis) {
              & $reg add ('HKU\' + $p.PSChildName + '\Control Panel\Desktop') /v PreferredUILanguages /t REG_MULTI_SZ /d pt-BR /f | Out-Null
            }
            & $reg load 'HKU\PadraoTmp' 'C:\Users\Default\NTUSER.DAT' | Out-Null
            if ($LASTEXITCODE -eq 0) {
              & $reg add 'HKU\PadraoTmp\Control Panel\Desktop' /v PreferredUILanguages /t REG_MULTI_SZ /d pt-BR /f | Out-Null
              [GC]::Collect(); [GC]::WaitForPendingFinalizers()
              & $reg unload 'HKU\PadraoTmp' | Out-Null
            }
            Write-Host '✅ Idioma instalado. Desconecte do RDP e conecte de novo para ver o Windows em português.'
          } else {
            Write-Host '::warning::A interface continua em inglês. Região, teclado ABNT2 e fuso do Brasil já estão aplicados.'
          }
          Write-Host '::endgroup::'
          exit 0

      - name: "🛡️ Liberar downloads (Defender e SmartScreen)"
        if: inputs.liberar_downloads
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          function Set-Reg($Path, $Name, $Value, $Type = 'DWord') {
            if (-not (Test-Path $Path)) { New-Item -Path $Path -Force | Out-Null }
            New-ItemProperty -Path $Path -Name $Name -Value $Value -PropertyType $Type -Force | Out-Null
          }
          try {
            $mp = Get-MpPreference -ErrorAction Stop
            if ($mp.DisableRealtimeMonitoring) {
              Write-Host 'ℹ️ O Defender já vem desativado neste runner.'
            } else {
              Set-MpPreference -DisableRealtimeMonitoring $true -DisableBehaviorMonitoring $true `
                -DisableIOAVProtection $true -DisableScriptScanning $true -PUAProtection Disabled -ErrorAction Stop
              Write-Host '✅ Defender: proteção em tempo real desativada'
            }
          } catch { Write-Host ('::warning::Defender: ' + $_.Exception.Message) }
          Set-Reg 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System' 'EnableSmartScreen' 0
          Set-Reg 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer' 'SmartScreenEnabled' 'Off' 'String'
          Set-Reg 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments' 'SaveZoneInformation' 1
          # o Windows Server bloqueia downloads de .exe no navegador antigo (IE ESC)
          foreach ($id in '{A509B1A7-37EF-4b3f-8CFC-4F3A74704073}', '{A509B1A8-37EF-4b3f-8CFC-4F3A74704073}') {
            Set-Reg "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\$id" 'IsInstalled' 0
          }
          Write-Host '✅ SmartScreen desligado e downloads liberados'
          Write-Host '⚠️ Esta VM é descartável: não entre em contas pessoais e cuidado com executáveis de origem duvidosa.'
          exit 0

      - name: "🧰 Instalar programas (Chocolatey)"
        if: inputs.programas != ''
        continue-on-error: true
        env:
          PROGRAMAS: ${{ inputs.programas }}
        run: |
          $ErrorActionPreference = 'Continue'
          $padrao = '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          $todos  = @($env:PROGRAMAS -split '[\s,;]+' | Where-Object { $_ })
          $ruins  = @($todos | Where-Object { $_ -notmatch $padrao })
          $lista  = @($todos | Where-Object { $_ -match $padrao })
          if ($ruins.Count -gt 0) { Write-Host ('::warning::Nomes ignorados (inválidos): ' + ($ruins -join ', ')) }
          if ($lista.Count -eq 0) { Write-Host 'Nenhum programa válido na lista.'; exit 0 }
          Write-Host ('📦 Instalando: ' + ($lista -join ', '))
          choco install @lista -y --no-progress --limit-output
          exit 0

      - name: "🧹 Liberar espaço em disco"
        if: inputs.liberar_espaco
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          function Mostrar($titulo) {
            Write-Host "::group::💾 $titulo"
            Get-PSDrive -PSProvider FileSystem |
              Select-Object Name,
                @{ n = 'Usado_GB'; e = { [math]::Round($_.Used / 1GB, 1) } },
                @{ n = 'Livre_GB'; e = { [math]::Round($_.Free / 1GB, 1) } } |
              Format-Table -AutoSize | Out-String | Write-Host
            Write-Host '::endgroup::'
          }
          Mostrar 'Espaço antes'
          $alvos = @(
            'C:\Android',
            'C:\Program Files (x86)\Android',
            'C:\Program Files\Android',
            'C:\hostedtoolcache\windows',
            'C:\Strawberry'
          ) | Where-Object { Test-Path $_ }
          # apaga tudo ao mesmo tempo: bem mais rápido do que uma pasta por vez
          $procs = @(foreach ($a in $alvos) {
            Write-Host "  🗑️ $a"
            Start-Process -FilePath cmd.exe -ArgumentList '/c', 'rd', '/s', '/q', "`"$a`"" -WindowStyle Hidden -PassThru
          })
          if ($procs.Count -gt 0) { $procs | Wait-Process -Timeout 900 -ErrorAction SilentlyContinue }
          Mostrar 'Espaço depois'
          exit 0

      # ───────────────── 7 · manter a sessão ─────────────────
      - name: "⏳ Sessão ativa"
        run: |
          $ErrorActionPreference = 'Continue'
          $fim    = [long]$env:SESSAO_FIM
          $ocioso = [int]$env:OCIOSO_MIN
          $parar  = 'C:\Users\Public\PARAR.txt'

          function Agora { [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() }
          function Conectado { @(Get-NetTCPConnection -LocalPort 3389 -State Established -ErrorAction SilentlyContinue).Count -gt 0 }
          function Avisar($texto) {
            Write-Host "📣 $texto"
            try { & (Join-Path $env:windir 'System32\msg.exe') '*' '/TIME:120' $texto 2>$null } catch { }
          }

          $fimBr = [DateTimeOffset]::FromUnixTimeSeconds($fim).ToOffset([TimeSpan]::FromHours(-3)).ToString('HH:mm')
          Write-Host "🟢 Sessão ativa até as $fimBr (horário de Brasília)."
          Write-Host "   Para encerrar antes: ícone 'Encerrar-sessao' na Área de Trabalho, arquivo $parar, ou cancele o workflow."
          if ($ocioso -gt 0) { Write-Host "   Se ninguém ficar conectado por $ocioso min, a sessão encerra sozinha." }

          $semCliente = Agora
          $ultimoLog  = 0
          $avisou10   = $false
          $avisou2    = $false
          while ($true) {
            $t = Agora
            if ($t -ge $fim) { Write-Host '⏰ Tempo da sessão esgotado.'; break }
            if (Test-Path $parar) { Write-Host '🛑 Pedido de encerramento recebido.'; break }

            $conectado = Conectado
            if ($conectado) {
              $semCliente = $t
            } elseif ($ocioso -gt 0 -and ($t - $semCliente) -ge ($ocioso * 60)) {
              Write-Host "💤 Ninguém conectado há $ocioso min: encerrando para não gastar à toa."
              break
            }

            $restam = [int][Math]::Ceiling(($fim - $t) / 60)
            if (-not $avisou10 -and $restam -le 10) { $avisou10 = $true; Avisar 'A sessão termina em 10 minutos. Salve o que estiver fazendo.' }
            if (-not $avisou2 -and $restam -le 2) { $avisou2 = $true; Avisar 'A sessão termina em 2 minutos!' }

            if (($t - $ultimoLog) -ge 900) {
              $ultimoLog = $t
              $estado = 'desconectado'
              if ($conectado) { $estado = 'conectado' }
              Write-Host ('⏳ restam {0} min · cliente {1}' -f $restam, $estado)
            }
            Start-Sleep -Seconds 15
          }
          Write-Host '🔴 Encerrando a sessão. A Tailscale desconecta sozinha ao fim do job.'
